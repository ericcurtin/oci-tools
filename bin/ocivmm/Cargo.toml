[package]
name = "ocivmm"
description = "Pet microVMs from OCI images, oci-vmm statically linked (krunvm equivalent)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
# Unwrapping the distro bzImage's gzip/zstd-compressed inner vmlinux
# (see disk.rs::extract_vmlinux) -- the same two decompressors the
# workspace already uses for OCI layers.
flate2.workspace = true
libc.workspace = true
ruzstd.workspace = true
oci-cli-common.workspace = true
oci-layer.workspace = true
oci-registry.workspace = true
oci-spec-types.workspace = true
oci-store.workspace = true
serde.workspace = true
serde_json.workspace = true
# The pet VM's disk image's own mountpoint (disk.rs::with_loop_mount).
tempfile.workspace = true
tracing.workspace = true

# The VMM itself (oci-vmm, our own KVM/virtio crate), the container
# machinery the one-off provisioning step runs the guest's package
# manager with, and loop-mounting the pet VM's own disk image are all
# Linux-only; gating them keeps the crate `cargo check`-able on other
# development hosts (where `ocivmm run`/`create`/`cp` report a clear
# "Linux only" error instead).
[target.'cfg(target_os = "linux")'.dependencies]
oci-mount.workspace = true
oci-runtime-core.workspace = true
oci-vmm.workspace = true
# `rustix::mount::unmount` (disk.rs) -- the workspace's own base
# `rustix` dependency doesn't enable the `mount` feature (no other
# crate needs it), so this one Linux-only user adds it directly.
rustix = { workspace = true, features = ["mount"] }

[lints]
workspace = true
